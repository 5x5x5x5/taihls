<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TAIHLS logo">
  <defs>
    <linearGradient id="helixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072B2"/>
      <stop offset="100%" stop-color="#009E73"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F4F8FB" stroke="#0072B2" stroke-width="2.5"/>
  <!-- Stylized DNA double helix merging into neural network nodes -->
  <path d="M16 14 C 28 14, 36 26, 48 26 C 36 26, 28 38, 16 38 C 28 38, 36 50, 48 50"
        fill="none" stroke="url(#helixGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M48 14 C 36 14, 28 26, 16 26 C 28 26, 36 38, 48 38 C 36 38, 28 50, 16 50"
        fill="none" stroke="#D55E00" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- Rungs -->
  <line x1="21" y1="20" x2="43" y2="20" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="32" x2="43" y2="32" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="44" x2="43" y2="44" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Neural nodes -->
  <circle cx="16" cy="14" r="4" fill="#0072B2"/>
  <circle cx="48" cy="14" r="4" fill="#D55E00"/>
  <circle cx="16" cy="26" r="3.5" fill="#D55E00"/>
  <circle cx="48" cy="26" r="3.5" fill="#009E73"/>
  <circle cx="16" cy="38" r="3.5" fill="#0072B2"/>
  <circle cx="48" cy="38" r="3.5" fill="#D55E00"/>
  <circle cx="16" cy="50" r="4" fill="#D55E00"/>
  <circle cx="48" cy="50" r="4" fill="#009E73"/>
</svg>
