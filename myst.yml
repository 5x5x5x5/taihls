# Jupyter Book 2 / MyST configuration.
# Structure (the TOC) lives in toc.yml — edit that, not this file. See `extends:`.
version: 1
extends:
  - toc.yml
project:
  title: 'TAIHLS — Topics in Artificial Intelligence for Health and Life Sciences'
  description: An interactive online textbook on AI for health and life sciences, for advanced high-school students and first-year undergraduates.
  keywords:
    - artificial intelligence
    - machine learning
    - health
    - life sciences
    - bioinformatics
    - undergraduate
    - open education
  # PLACEHOLDER — replace with the real author(s).
  authors:
    - name: PLACEHOLDER Author
      email: placeholder@example.com
  github: https://github.com/5x5x5x5/taihls
  license:
    content: CC-BY-4.0
    code: MIT
  bibliography:
    - references.bib
  # In-browser execution via JupyterLite/Pyodide — readers run code with no install.
  jupyter:
    lite: true
  # Binder "launch" button. The Colab/Binder badges in chapters are other on-ramps.
  binder: https://mybinder.org/v2/gh/5x5x5x5/taihls/HEAD
site:
  template: book-theme
  options:
    favicon: favicon.png
